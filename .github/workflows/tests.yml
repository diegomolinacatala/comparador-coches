name: Comprobación

# En cada push o Pull Request, GitHub instala las librerías del proyecto y
# comprueba que ningún archivo .py tiene errores de sintaxis.
on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py
